<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custos - MAX 3D STUDIO</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--secondary);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        header h1 { color: var(--primary); margin: 0; }
        header p { color: #666; font-style: italic; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .results {
            grid-column: span 2;
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        .result-item { text-align: center; }
        .result-item span { display: block; font-size: 0.8rem; opacity: 0.8; }
        .result-item strong { font-size: 1.5rem; color: var(--secondary); }

        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #777;
            text-align: center;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .results { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MAX 3D STUDIO</h1>
        <p>Calculadora de Precificação Premium - Bambu Lab A1</p>
    </header>

    <div class="grid">
        <div class="section">
            <h3>📦 Dados da Impressão</h3>
            <div class="input-group">
                <label>Peso da Peça (g)</label>
                <input type="number" id="peso" value="50" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Tempo de Impressão (Horas)</label>
                <input type="number" id="tempo" value="2" step="0.1" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Preço do Filamento (R$/kg)</label>
                <input type="number" id="precoFilamento" value="120" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Acessórios/Embalagem (R$)</label>
                <input type="number" id="acessorios" value="2.00" oninput="calcular()">
            </div>
        </div>

        <div class="section">
            <h3>⚙️ Parâmetros Operacionais</h3>
            <div class="input-group">
                <label>Custo Hora Impressora (R$/h)</label>
                <input type="number" id="custoHora" value="1.50" step="0.1" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Consumo Energia (Watts)</label>
                <input type="number" id="watts" value="150" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Taxa de Energia (R$/kWh)</label>
                <input type="number" id="taxaKwh" value="0.85" step="0.01" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Margem de Lucro (%)</label>
                <input type="number" id="lucro" value="100" oninput="calcular()">
            </div>
        </div>

        <div class="results">
            <div class="result-item">
                <span>Custo de Produção</span>
                <strong id="resCusto">R$ 0,00</strong>
            </div>
            <div class="result-item">
                <span>Preço Sugerido (Venda)</span>
                <strong id="resVenda">R$ 0,00</strong>
            </div>
            <div class="result-item">
                <span>Lucro Líquido</span>
                <strong id="resLucro">R$ 0,00</strong>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <p>Estratégia MEI: Acabamento Premium & Peças Exclusivas.</p>
        <p>#3DPrinting #BambuLabA1 #Max3DStudio</p>
    </div>
</div>

<script>
    function calcular() {
        // Obter valores
        const peso = parseFloat(document.getElementById('peso').value) || 0;
        const tempo = parseFloat(document.getElementById('tempo').value) || 0;
        const precoFilamento = parseFloat(document.getElementById('precoFilamento').value) || 0;
        const acessorios = parseFloat(document.getElementById('acessorios').value) || 0;
        const custoHoraMaq = parseFloat(document.getElementById('custoHora').value) || 0;
        const watts = parseFloat(document.getElementById('watts').value) || 0;
        const taxaKwh = parseFloat(document.getElementById('taxaKwh').value) || 0;
        const margemLucro = parseFloat(document.getElementById('lucro').value) || 0;

        // Cálculos
        const custoMaterial = (peso / 1000) * precoFilamento;
        const custoEnergia = (watts / 1000) * tempo * taxaKwh;
        const custoMaq = tempo * custoHoraMaq;
        
        const custoTotal = custoMaterial + custoEnergia + custoMaq + acessorios;
        const precoVenda = custoTotal * (1 + (margemLucro / 100));
        const lucroLiquido = precoVenda - custoTotal;

        // Formatação
        document.getElementById('resCusto').innerText = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('resVenda').innerText = precoVenda.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('resLucro').innerText = lucroLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Inicializar cálculo
    calcular();
</script>

</body>
</html>
